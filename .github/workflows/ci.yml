name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sqlite + local storage
            database: sqlite
            storage: local
          - profile: postgres + minio
            database: postgres
            storage: s3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secondlook
          POSTGRES_PASSWORD: secondlook
          POSTGRES_DB: secondlook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secondlook" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_md
      - name: PyMuPDF import boundary (§4.8)
        run: pytest tests/test_import_boundaries.py -q
      - name: Start MinIO
        if: matrix.storage == 's3'
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio-secret \
            minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', aws_access_key_id='minio', aws_secret_access_key='minio-secret', region_name='us-east-1').create_bucket(Bucket='secondlook-test')"
      - name: Configure Postgres and MinIO
        if: matrix.database == 'postgres'
        run: |
          echo "TEST_DATABASE_URL=postgresql+psycopg://secondlook:secondlook@127.0.0.1:5432/secondlook" >> "$GITHUB_ENV"
          echo "TEST_STORAGE_BACKEND=s3" >> "$GITHUB_ENV"
          echo "TEST_S3_ENDPOINT_URL=http://127.0.0.1:9000" >> "$GITHUB_ENV"
          echo "TEST_S3_BUCKET=secondlook-test" >> "$GITHUB_ENV"
          echo "TEST_S3_ACCESS_KEY=minio" >> "$GITHUB_ENV"
          echo "TEST_S3_SECRET_KEY=minio-secret" >> "$GITHUB_ENV"
      - name: Tests (including the redaction leak test on both PDF backends)
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  container:
    name: container smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start with Compose
        run: |
          python -c "from cryptography.fernet import Fernet" 2>/dev/null || pip install cryptography
          cat > .env <<ENV
          FILE_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          AUTH_MODE=none
          LLM_PROVIDER=fake
          RETENTION_HOURS=1
          ENV
          mkdir -p data && sudo chown 10001 data
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --build app
      - name: Smoke test
        run: |
          pip install pymupdf
          python scripts/smoke_test.py http://127.0.0.1:8000
      - name: Logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml logs app
      - name: Exposed without auth must refuse to start (§11)
        run: |
          if docker run --rm -e AUTH_MODE=none -e APP_HOST=0.0.0.0 -e LLM_PROVIDER=fake \
               -e FILE_ENCRYPTION_KEY=S4VQ6p8V8KHe-Ff6MfmrnJu2mP1bH3m0ElxTnW90sc8= secondlook:latest; then
            echo "container started without authentication on a public interface" && exit 1
          fi
