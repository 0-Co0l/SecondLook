[project]
name = "secondlook-backend"
version = "0.1.0"
description = "Tax return review backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "anthropic>=0.37.1",
  "boto3>=1.35.0",
  "cryptography>=43.0.1",
  "fastapi>=0.115.0",
  "pillow>=10.4.0",
  "pydantic-settings>=2.5.2",
  "pymupdf>=1.24.10",
  "python-multipart>=0.0.10",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "httpx>=0.27.2",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
